spring.application.name=TripCast

spring.datasource.url=jdbc:mysql://localhost:3306/TripCast?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

weather.api.base-url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
weather.api.key=${WEATHER_API_KEY}