spring.application.name=TripCast-test

spring.datasource.url=jdbc:h2:mem:tripcast;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

weather.api.base-url=http://127.0.0.1:9
weather.api.key=test-key

tour-climate.api.base-url=http://127.0.0.1:9
tour-climate.api.key=test-key
tour-climate.api.connect-timeout=100ms
tour-climate.api.read-timeout=100ms

app.climate-index-sync.enabled=false

app.tour-spot-import.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
